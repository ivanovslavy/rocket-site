<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" font-family="'Baloo 2','DejaVu Sans',sans-serif">
  <defs>
    <radialGradient id="bg" cx="32%" cy="34%" r="90%">
      <stop offset="0" stop-color="#1c1250"/>
      <stop offset="0.55" stop-color="#0d0930"/>
      <stop offset="1" stop-color="#06061c"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="0.5" stop-color="#34e0ff"/>
      <stop offset="1" stop-color="#a86bff"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66b"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5cc8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7ce8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="700" cy="90" r="3" opacity="0.8"/>
    <circle cx="980" cy="160" r="4" opacity="0.7"/>
    <circle cx="1120" cy="470" r="3.5" opacity="0.8"/>
    <circle cx="760" cy="540" r="3" opacity="0.6"/>
    <circle cx="640" cy="300" r="2.5" opacity="0.6"/>
    <circle cx="1060" cy="300" r="2.5" opacity="0.5"/>
  </g>
  <g fill="#7ef0ff">
    <path d="M1040 110l5 16 16 5-16 5-5 16-5-16-16-5 16-5z"/>
    <path d="M690 430l4 13 13 4-13 4-4 13-4-13-13-4 13-4z" opacity="0.85"/>
  </g>

  <!-- rocket badge (left) -->
  <g transform="translate(90 105) scale(0.82)">
    <rect width="512" height="512" rx="116" fill="#0a0a2e" opacity="0.55"/>
    <g transform="rotate(-22 256 262)" opacity="0.5">
      <ellipse cx="256" cy="262" rx="196" ry="74" fill="none" stroke="#34e0ff" stroke-width="5" opacity="0.45"/>
    </g>
    <g filter="url(#glow)">
      <path d="M222 352c14 46 34 78 34 78s20-32 34-78z" fill="url(#flame)"/>
      <path d="M236 354c10 30 20 50 20 50s10-20 20-50z" fill="#fff6c2"/>
      <path d="M198 286 158 340c-3 4 1 9 6 7l40-16z" fill="#ff5cc8" stroke="#06061c" stroke-width="7" stroke-linejoin="round"/>
      <path d="M314 286 354 340c3 4-1 9-6 7l-40-16z" fill="#ff5cc8" stroke="#06061c" stroke-width="7" stroke-linejoin="round"/>
      <path d="M256 112c41 34 60 92 60 150v38c0 33-27 60-60 60s-60-27-60-60v-38c0-58 19-116 60-150z"
            fill="url(#body)" stroke="#06061c" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="256" cy="220" r="30" fill="#0a0a2e" stroke="#06061c" stroke-width="8"/>
      <circle cx="256" cy="220" r="18" fill="#7ef0ff"/>
      <circle cx="248" cy="212" r="6" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- text (right) -->
  <text x="552" y="252" font-size="110" font-weight="800" fill="url(#title)" filter="url(#glow)">$ROCKET</text>
  <text x="556" y="312" font-size="33" font-weight="600" fill="#9cc4ff">Infinite space, zero nonsense.</text>

  <g transform="translate(556 358)">
    <rect width="600" height="58" rx="29" fill="#141047" stroke="#34e0ff" stroke-opacity="0.4" stroke-width="2"/>
    <text x="28" y="38" font-size="26" font-weight="700">
      <tspan fill="#34e0ff">Ethereum</tspan><tspan fill="#586199">   ·   </tspan><tspan fill="#a86bff">Uniswap v2</tspan><tspan fill="#586199">   ·   </tspan><tspan fill="#ff5cc8">Anti-bot</tspan>
    </text>
  </g>
  <text x="556" y="470" font-size="25" font-weight="500" fill="#ffffff" opacity="0.55">Fair launch · LP locked · 0% tax after launch</text>
</svg>
